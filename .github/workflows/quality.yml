name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deterministic:
    name: Python, architecture, frontend, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANKI_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: settings_ui/package-lock.json

      - name: Install Python quality dependencies
        run: python -m pip install --group dev PyQt6

      - name: Install frontend dependencies
        working-directory: settings_ui
        run: npm ci

      - name: Validate schemas and generated contracts
        run: |
          python scripts/dev.py config-schema
          python scripts/dev.py contracts-check

      - name: Run static and architecture checks
        run: |
          python scripts/dev.py lint
          python scripts/dev.py typecheck
          python scripts/dev.py arch

      - name: Run Python tests and coverage
        run: |
          python scripts/dev.py test
          python scripts/dev.py coverage

      - name: Run frontend validation and coverage
        run: python scripts/dev.py test-svelte

      - name: Smoke-test mutation collection
        run: python scripts/dev.py muttest smoke

      - name: Upload deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-diagnostics
          if-no-files-found: ignore
          path: |
            coverage.xml
            coverage.json
            htmlcov/
            settings_ui/coverage/
            .pytest_cache/
            mutants/mutmut-stats.json

  platform-runtime:
    name: Runtime behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    env:
      ANKI_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install --group dev PyQt6

      - name: Run platform/runtime tests
        run: >-
          python scripts/dev.py test
          tests/test_runtime_manager_install.py
          tests/test_runtime_manager_state.py
          tests/test_runtime_platform.py
          tests/test_runtime_lookup.py

      - name: Upload platform diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.os }}-diagnostics
          if-no-files-found: ignore
          path: .pytest_cache/

  real-anki-e2e:
    name: Real Anki E2E
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, anki-25.09]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install repository dependencies
        run: python3 scripts/dev.py setup

      - name: Provision managed runtime
        run: python3 scripts/dev.py runtime-install

      - name: Run parallel real-Anki E2E
        run: python3 scripts/dev.py test-e2e-parallel

      - name: Run canonical serial E2E on release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/dev.py test-e2e

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-anki-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            e2e-artifacts/
            addon/anki_audio_quick_editor/*.log
            addon/anki_audio_quick_editor/aqe_artifacts/

  focused-mutation:
    name: Mutation (${{ matrix.group }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [architecture, config, region-delete, release, runtime, prosody, recorder]
    env:
      ANKI_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install mutation dependencies
        run: python -m pip install --group dev PyQt6

      - name: Locate previous successful mutation run
        id: previous-run
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "quality.yml",
              status: "success",
              per_page: 20,
            });
            const previous = response.data.workflow_runs.find((run) => run.id !== context.runId);
            core.setOutput("run-id", previous ? String(previous.id) : "");

      - name: Download previous mutation diagnostics
        if: steps.previous-run.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mutation-${{ matrix.group }}
          path: previous-mutation
          run-id: ${{ steps.previous-run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Run focused mutation group
        run: python scripts/dev.py muttest group "${{ matrix.group }}"

      - name: Export mutation category counts
        if: always()
        run: python scripts/dev.py muttest export-cicd-stats

      - name: Compare mutation categories with prior run
        if: always()
        run: >-
          python scripts/mutation_report_diff.py
          --current mutants/mutmut-cicd-stats.json
          --previous previous-mutation/mutmut-cicd-stats.json
          --output mutants/mutation-diff.json

      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.group }}
          if-no-files-found: warn
          path: |
            mutants/mutmut-stats.json
            mutants/*.json

  state-management-mutation:
    name: Frontend state-management mutation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: settings_ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: settings_ui
        run: npm ci

      - name: Mutate transport and practice reducers
        working-directory: settings_ui
        run: npm run test:mutation:state-management

      - name: Upload reducer mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-state-management
          if-no-files-found: error
          path: settings_ui/reports/mutation/state-management.json
